              example:
                id: vehicle-example-1
                registrationNumber: EXAMPLE-01
                type: Example van
                maxWeight: 3500
                maxVolume: 18
                status: available
          headers:
            Location:
              description: URI of the created resource, addressed by technical ID.
              schema:
                type: string
                format: uri-reference
              example: /api/vehicles/vehicle-example-1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
