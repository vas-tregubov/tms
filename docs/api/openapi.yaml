openapi: 3.0.3
info:
  title: TMS API
  version: 0.1.0
  description:
    "Contract-first REST API for the dispatcher TMS MVP. Target architecture:
    NestJS/TypeScript modular monolith, Controller -> Service -> Repository, PostgreSQL. This file
    is the single API contract; it does not imply backend implementation. Requests use technical
    IDs, not Route/Trip business numbers. PATCH modifies supplied properties only; unknown
    properties and empty patches are 400. All failures use ApiError. Dates are calendar dates; Route
    times are the end-point acceptance window. Time-zone and overnight semantics remain open.
    Schemas marked as provisional describe only confirmed behavior and are not implementation-ready
    until the documented decisions are approved. No RBAC, public registration, additional roles,
    tenants, queues or routing optimization are introduced. All example identities and records are
    fictional."
servers:
  - url: http://localhost:3000/api
    description: Planned local backend; the current NestJS scaffold does not implement these endpoints.
tags:
  - name: Routes
    description: Route planning and acceptance windows.
  - name: Trips
    description: Ordered Route composition with Driver and Vehicle assignment.
  - name: Drivers
    description: Independent Drivers directory.
  - name: Vehicles
    description: Independent Vehicles directory.
  - name: Distribution Centers
    description: Independent Distribution Centers directory.
  - name: Logistics Points
    description: Independent Logistics Points directory.
  - name: Auth
    description: Dispatcher-only JWT access/refresh authentication; refresh transport remains undecided.
security:
  - bearerAuth: []
x-open-decisions:
  - Route and Trip time zones, overnight windows and multi-day scheduling.
  - Manual status transition matrices, same-status requests and status propagation.
  - Trip editing, reordering, reassignment and removal/release rules; completed-document retention.
  - Route membership lifetime, historical snapshots and deletion policies beyond conservative
    conflicts.
  - Driver/Vehicle scheduling availability and compatibility of Route dates/windows with a Trip.
  - Vehicle and Logistics Point initial/status-update policies; no exhaustive enums exist.
  - Capacity units/bounds, coordinate format, structured contacts/schedules and registration
    uniqueness.
  - Dispatcher login identifier, JWT lifetimes, refresh transport/rotation and logout guarantees.
  - PointReference {type,id} is the proposed unambiguous API representation; frontend integration
    needs an adapter.
  - Lost-update policy for concurrent general PATCH operations; no version/ETag guarantee is
    invented.
paths:
  /routes:
    get:
      tags:
        - Routes
      summary: List Routes
      operationId: listRoutes
      description:
        Paginated standalone Routes list. Search matches number, startPoint.name and
        endPoint.name. Date bounds are inclusive; inverted bounds are 400. Default ordering is
        business number descending, then technical ID ascending. Results must have deterministic
        ordering; no client sorting parameter is introduced.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/RouteStatus"
      responses:
        "200":
          description: Routes page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteListResponse"
              example:
                items:
                  - id: route-example-1
                    number: MR-000123
                    date: "2026-11-12"
                    startPoint:
                      type: distribution-center
                      id: dc-example-1
                      name: Example Distribution Center
                    endPoint:
                      type: logistics-point
                      id: lp-example-1
                      name: Example Logistics Point
                    startTime: "09:30"
                    endTime: "11:00"
                    status: created
                total: 1
                page: 1
                limit: 20
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Routes
      summary: Create a Route
      operationId: createRoute
      description:
        Create a Route with server-generated id and business number and initial status created.
        startTime and endTime are the acceptance window at endPoint, not vehicle movement times.
        Point references must resolve in their named directories; unknown references are 400.
        Time-zone, overnight-window and point-compatibility rules remain pending approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteRequest"
            example:
              date: "2026-11-12"
              startPoint:
                type: distribution-center
                id: dc-example-1
              endPoint:
                type: logistics-point
                id: lp-example-1
              startTime: "09:30"
              endTime: "11:00"
              comment: Use the north unloading gate.
      responses:
        "201":
          description: Route created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
              example:
                id: route-example-1
                number: MR-000123
                date: "2026-11-12"
                startPoint:
                  type: distribution-center
                  id: dc-example-1
                  name: Example Distribution Center
                endPoint:
                  type: logistics-point
                  id: lp-example-1
                  name: Example Logistics Point
                startTime: "09:30"
                endTime: "11:00"
                status: created
                comment: Use the north unloading gate.
          headers:
            Location:
              description: URI of the created resource, addressed by technical ID.
              schema:
                type: string
                format: uri-reference
              example: /api/routes/route-example-1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /routes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Routes
      summary: Get a Route
      operationId: getRoute
      description: Get Route details by technical ID. A business number is not a lookup alias.
      responses:
        "200":
          description: Route details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
              example:
                id: route-example-1
                number: MR-000123
                date: "2026-11-12"
                startPoint:
                  type: distribution-center
                  id: dc-example-1
                  name: Example Distribution Center
                endPoint:
                  type: logistics-point
                  id: lp-example-1
                  name: Example Logistics Point
                startTime: "09:30"
                endTime: "11:00"
                status: created
                comment: Use the north unloading gate.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Routes
      summary: Partially update a Route
      operationId: updateRoute
      description:
        "Change only supplied editable fields. Omitted fields retain their values; comment:
        null clears the note. id, number and status cannot be supplied. A completed Route returns
        409 ROUTE_COMPLETED. Additional restrictions on assigned/intransit Route edits and their
        effect on an existing Trip require approval; reject unapproved effects with 409 and no
        writes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRouteRequest"
            example:
              comment: null
      responses:
        "200":
          description: Route after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Routes
      summary: Delete a Route
      operationId: deleteRoute
      description:
        "Delete an unassigned, non-completed Route only when deletion is permitted. A Route
        referenced by a Trip returns 409 RESOURCE_IN_USE. Completed-Route deletion and historical
        retention are not approved: return 409 BUSINESS_RULE_NOT_APPROVED rather than remove
        history. Never implicitly detach a Route or change Trip status. Any other deletion case
        without an approved rule also returns 409 BUSINESS_RULE_NOT_APPROVED without writes."
      responses:
        "204":
          description: Route deleted under an approved deletion rule. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /trips:
    get:
      tags:
        - Trips
      summary: List Trips
      operationId: listTrips
      description:
        Paginated standalone Trips list. Search matches number, driver.fullName and
        vehicle.registrationNumber. Date bounds are inclusive; inverted bounds are 400. Default
        ordering is business number descending, then technical ID ascending. Results must have
        deterministic ordering; no client sorting parameter is introduced.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/TripStatus"
      responses:
        "200":
          description: Trips page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripListResponse"
              example:
                items:
                  - id: trip-example-1
                    number: TR-000125
                    date: "2026-11-12"
                    startTime: "08:00"
                    endTime: "18:00"
                    routeCount: 2
                    driver:
                      id: driver-example-1
                      fullName: Example Driver
                    vehicle:
                      id: vehicle-example-1
                      registrationNumber: EXAMPLE-01
                    status: assigned
                total: 1
                page: 1
                limit: 20
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Trips
      summary: Create a Trip
      operationId: createTrip
      description:
        "Atomically create a Trip with initial status assigned, a server-generated id and
        business number, an existing Driver and Vehicle, and at least one ordered Route ID. Reject
        duplicate routeIds with 400, a missing Route with 404, and a Route that is not created or is
        already assigned to another Trip with 409 ROUTE_ALREADY_ASSIGNED. This is checked against
        persisted assignments, not only a status or mock snapshot. Concurrent competing assignments
        must yield a conflict: at most one Trip claims a Route. On any failure, no Trip, Route
        assignment, status change or history entry is partially committed. Successful creation
        assigns the selected Routes and changes their statuses to assigned. Driver/Vehicle schedule
        availability and date/window compatibility rules are not yet approved."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
            example:
              date: "2026-11-12"
              startTime: "08:00"
              endTime: "18:00"
              routeIds:
                - route-example-1
                - route-example-2
              driverId: driver-example-1
              vehicleId: vehicle-example-1
              comment: Follow the specified Route order.
      responses:
        "201":
          description: Trip created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
              example:
                id: trip-example-1
                number: TR-000125
                date: "2026-11-12"
                startTime: "08:00"
                endTime: "18:00"
                routes:
                  - id: route-example-1
                    number: MR-000123
                    date: "2026-11-12"
                    startPoint:
                      type: distribution-center
                      id: dc-example-1
                      name: Example Distribution Center
                    endPoint:
                      type: logistics-point
                      id: lp-example-1
                      name: Example Logistics Point
                    startTime: "09:30"
                    endTime: "11:00"
                    status: assigned
                  - id: route-example-2
                    number: MR-000124
                    date: "2026-11-12"
                    startPoint:
                      type: distribution-center
                      id: dc-example-1
                      name: Example Distribution Center
                    endPoint:
                      type: logistics-point
                      id: lp-example-1
                      name: Example Logistics Point
                    startTime: "09:30"
                    endTime: "11:00"
                    status: assigned
                driver:
                  id: driver-example-1
                  fullName: Example Driver
                  contacts: Example contact details
                vehicle:
                  id: vehicle-example-1
                  registrationNumber: EXAMPLE-01
                  type: Example van
                  maxWeight: 3500
                  maxVolume: 18
                  status: available
                status: assigned
                comment: Follow the specified Route order.
          headers:
            Location:
              description: URI of the created resource, addressed by technical ID.
              schema:
                type: string
                format: uri-reference
              example: /api/trips/trip-example-1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /trips/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Trips
      summary: Get a Trip
      operationId: getTrip
      description: Get Trip details by technical ID. A business number is not a lookup alias.
      responses:
        "200":
          description: Trip details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
              example:
                id: trip-example-1
                number: TR-000125
                date: "2026-11-12"
                startTime: "08:00"
                endTime: "18:00"
                routes:
                  - id: route-example-1
                    number: MR-000123
                    date: "2026-11-12"
                    startPoint:
                      type: distribution-center
                      id: dc-example-1
                      name: Example Distribution Center
                    endPoint:
                      type: logistics-point
                      id: lp-example-1
                      name: Example Logistics Point
                    startTime: "09:30"
                    endTime: "11:00"
                    status: assigned
                  - id: route-example-2
                    number: MR-000124
                    date: "2026-11-12"
                    startPoint:
                      type: distribution-center
                      id: dc-example-1
                      name: Example Distribution Center
                    endPoint:
                      type: logistics-point
                      id: lp-example-1
                      name: Example Logistics Point
                    startTime: "09:30"
                    endTime: "11:00"
                    status: assigned
                driver:
                  id: driver-example-1
                  fullName: Example Driver
                  contacts: Example contact details
                vehicle:
                  id: vehicle-example-1
                  registrationNumber: EXAMPLE-01
                  type: Example van
                  maxWeight: 3500
                  maxVolume: 18
                  status: available
                status: assigned
                comment: Follow the specified Route order.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Trips
      summary: Partially update a Trip
      operationId: updateTrip
      description:
        "Change only supplied fields; comment: null clears the note. id, number and status are
        not editable here. If routeIds is supplied, it denotes the complete ordered replacement,
        with no duplicates and at least one Route. Reordering, reassignment, release of removed
        Routes, editing completed Trips, and resource-availability rules remain pending approval.
        Until a relevant rule is approved, return 409 BUSINESS_RULE_NOT_APPROVED with no writes. Any
        approved membership change must be atomic and must never assign a Route to two Trips. Do not
        automatically derive Trip status from Route statuses."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripRequest"
            example:
              comment: null
      responses:
        "200":
          description: Trip after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-contract-status: Trip editing and reassignment rules pending approval
    delete:
      tags:
        - Trips
      summary: Delete a Trip
      operationId: deleteTrip
      description:
        Trip deletion, Route release and completed-Trip retention rules are pending approval.
        For any case without an approved deletion rule, return 409 BUSINESS_RULE_NOT_APPROVED and
        leave the Trip and all Routes unchanged. Never cascade delete Routes or infer their
        replacement statuses. The 204 response describes only a future approved successful deletion.
      responses:
        "204":
          description: Trip deleted under an approved deletion rule. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-contract-status: Deletion and Route release rules pending approval
  /drivers:
    get:
      tags:
        - Drivers
      summary: List Drivers
      operationId: listDrivers
      description:
        Paginated standalone Drivers list. Search matches fullName and contacts. Default
        ordering is fullName ascending, then technical ID ascending. Results must have deterministic
        ordering; no client sorting parameter is introduced.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Drivers page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverListResponse"
              example:
                items:
                  - id: driver-example-1
                    fullName: Example Driver
                    contacts: Example contact details
                total: 1
                page: 1
                limit: 20
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Drivers
      summary: Create a Driver
      operationId: createDriver
      description:
        Create an independent directory record; directory data is never inferred from existing
        Routes or Trips. Unknown referenced IDs are 400. Technical IDs are server-owned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDriverRequest"
            example:
              fullName: Example Driver
              contacts: Example contact details
      responses:
        "201":
          description: Driver created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverResponse"
              example:
                id: driver-example-1
                fullName: Example Driver
                contacts: Example contact details
          headers:
            Location:
              description: URI of the created resource, addressed by technical ID.
              schema:
                type: string
                format: uri-reference
              example: /api/drivers/driver-example-1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /drivers/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Drivers
      summary: Get a Driver
      operationId: getDriver
      description: Get Driver details by technical ID. A business number is not a lookup alias.
      responses:
        "200":
          description: Driver details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverResponse"
              example:
                id: driver-example-1
                fullName: Example Driver
                contacts: Example contact details
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Drivers
      summary: Partially update a Driver
      operationId: updateDriver
      description:
        Change only supplied properties. Omitted properties retain their values; null is
        invalid unless explicitly allowed. Technical IDs cannot be changed. Effects on historical
        documents require approval; reject a change with 409 BUSINESS_RULE_NOT_APPROVED if its
        impact cannot be safely determined.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDriverRequest"
            example:
              contacts: Updated example contact
      responses:
        "200":
          description: Driver after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Drivers
      summary: Delete a Driver
      operationId: deleteDriver
      description:
        Delete an unused directory record. If any existing Route or Trip references it, return
        409 RESOURCE_IN_USE without changing any record. Do not cascade delete business documents.
        Archival and historical-reference policies are not approved.
      responses:
        "204":
          description: Driver deleted under an approved deletion rule. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
