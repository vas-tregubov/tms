  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate the current dispatcher
      operationId: login
      security: []
      description:
        JWT access/refresh authentication for the dispatcher only. No public registration, role
        or permission management. The login identifier, refresh-token delivery, token lifetimes and
        session policy require approval; this operation is not implementation-ready until those
        decisions are made. The response defines the confirmed access-token portion only. Invalid
        credentials return a generic 401 without exposing whether an account exists. Never return or
        log the password.
      x-contract-status: Login identifier and refresh transport pending approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access token issued; refresh-token delivery remains unspecified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh the dispatcher access token
      operationId: refresh
      security: []
      description:
        "Requires a valid refresh credential, not an access Bearer token. Refresh transport
        (cookie, header or body), credential schema, rotation, reuse handling and expiration are
        pending approval. security: [] removes the global access-token requirement; it does not make
        this operation anonymous. No request body, cookie or header is specified until the transport
        is approved. Do not infer refresh delivery from AccessTokenResponse. This is a partial
        contract and must be finalized before implementation."
      x-contract-status: "Partial contract: refresh transport and session behavior pending approval"
      responses:
        "200":
          description: New access token; refresh-token rotation and delivery are unspecified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: End the current dispatcher authentication flow
      operationId: logout
      security: []
      description:
        "Refresh transport and logout behavior remain pending approval. security: [] removes
        the access-token requirement so an expired access token is not assumed to prevent logout;
        the required session/refresh credential and its transport are not yet specified. Successful
        204 does not promise immediate JWT access-token revocation, logout from every device,
        refresh-family revocation or a particular repeated-logout result. No request shape is
        invented. Finalize these decisions before implementation."
      x-contract-status: "Partial contract: refresh transport and session behavior pending approval"
      responses:
        "204":
          description: Logout acknowledged under the session policy to be approved. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get the current dispatcher
      operationId: getCurrentDispatcher
      description:
        Resolve the current dispatcher from a valid JWT access token. This is not a Driver
        lookup. No roles or permissions are returned.
      responses:
        "200":
          description: Current dispatcher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentDispatcherResponse"
              example:
                id: dispatcher-example-1
                fullName: Example Dispatcher
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        JWT access token for protected business endpoints and /auth/me. It does not define
        refresh-token transport.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Opaque technical resource ID, never a Route or Trip business number.
      schema:
        type: string
        minLength: 1
      example: record-example-1
    Page:
      name: page
      in: query
      description: One-based page number. Pages beyond the result set return an empty items array.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Maximum number of records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description:
        Trimmed, case-insensitive substring search over the fields listed by the operation.
        Omit or send an empty string for no search restriction.
      schema:
        type: string
    DateFrom:
      name: dateFrom
      in: query
      description:
        Inclusive lower bound on the document date. dateFrom after dateTo is 400, not an
        ignored filter.
      schema:
        type: string
        format: date
        description: Calendar date in YYYY-MM-DD format. This is not a UTC timestamp.
        example: "2026-11-12"
    DateTo:
      name: dateTo
      in: query
      description: Inclusive upper bound on the document date.
      schema:
        type: string
        format: date
        description: Calendar date in YYYY-MM-DD format. This is not a UTC timestamp.
        example: "2026-11-12"
    RouteStatus:
      name: status
      in: query
      description: Exact Route status filter.
      schema:
        $ref: "#/components/schemas/RouteStatus"
    TripStatus:
      name: status
      in: query
      description: Exact Trip status filter.
      schema:
        $ref: "#/components/schemas/TripStatus"
  schemas:
    RouteStatus:
      type: string
      enum:
        - created
        - assigned
        - intransit
        - completed
      description:
        Existing Route status vocabulary. Enum membership does not authorize a transition; the
        transition matrix is pending approval.
    TripStatus:
      type: string
      enum:
        - created
        - assigned
        - intransit
        - completed
      description:
        Existing Trip status vocabulary. A new Trip is assigned. Trip status is not
        automatically derived from Route statuses.
    PointType:
      type: string
      enum:
        - distribution-center
        - logistics-point
      description:
        Identifies the directory in which a point ID must be resolved. This discriminator is an
        API reference format, not a new business entity.
    PointReference:
      type: object
      description:
        An unambiguous reference to an existing directory record. No client-supplied name,
        address or other trusted directory data is accepted. Each point reference is replaced as a
        whole in PATCH.
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          $ref: "#/components/schemas/PointType"
        id:
          type: string
          description: Technical ID in the directory selected by type.
          minLength: 1
    PointSummary:
      type: object
      description: Read-only point projection for Route lists and details. The ID is scoped by type.
      additionalProperties: false
      required:
        - type
        - id
        - name
      properties:
        type:
          $ref: "#/components/schemas/PointType"
        id:
          type: string
          description: Opaque technical identifier. Never use a business number as a resource ID.
          minLength: 1
          readOnly: true
          example: record-example-1
        name:
          type: string
    DriverSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - fullName
      properties:
        id:
          type: string
          description: Opaque technical identifier. Never use a business number as a resource ID.
          minLength: 1
          readOnly: true
          example: record-example-1
        fullName:
          type: string
    VehicleSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - registrationNumber
      properties:
        id:
          type: string
          description: Opaque technical identifier. Never use a business number as a resource ID.
          minLength: 1
          readOnly: true
          example: record-example-1
        registrationNumber:
          type: string
    CreateRouteRequest:
      type: object
      additionalProperties: false
      required:
        - date
        - startPoint
        - endPoint
        - startTime
        - endTime
      properties:
        date:
