    get:
      tags:
        - Routes
      summary: List Route status history
      operationId: listRouteStatusHistory
      description:
        Return only recorded status facts, oldest first by occurredAt, with a server-stable tie
        order. Pagination applies to recorded events, not to future timeline markers. A new record
        without recorded history returns an empty page; an unknown resource is 404. Do not fabricate
        timestamps or authors from document date/time. The history projection is not a general
        audit-log CRUD API.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recorded status history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteStatusHistoryListResponse"
              example:
                items:
                  - status: created
                    occurredAt: "2026-11-12T06:30:00Z"
                    author: Example Dispatcher
                total: 1
                page: 1
                limit: 20
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /routes/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags:
        - Routes
      summary: Request a Route status change
      operationId: changeRouteStatus
      description:
        Accept only the existing Route status vocabulary. The manual transition graph,
        same-status behavior and propagation between Trip and Route statuses have not been approved.
        Enum order is not a transition rule. Reject every unapproved transition with 409
        BUSINESS_RULE_NOT_APPROVED and no changes. A completed Route cannot be modified under
        current MVP rules. An approved change must atomically update the status and its history,
        assigning event timestamp and author on the server. Resolve conflicting concurrent changes
        with 409 rather than committing an invalid transition.
      x-contract-status: Transition rules pending approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRouteStatusRequest"
      responses:
        "200":
          description: Resource after an approved status transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
