    ValidationDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Request property path or query/path parameter name; array indices use bracket notation.
          minLength: 1
        code:
          type: string
          description: Machine-readable validation reason.
          minLength: 1
        message:
          type: string
          description: Safe explanation without echoing credentials or tokens.
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description:
            Stable machine-readable error code. Clients must branch on code, not message. Examples
            include VALIDATION_ERROR, ROUTE_NOT_FOUND, ROUTE_ALREADY_ASSIGNED, RESOURCE_IN_USE,
            BUSINESS_RULE_NOT_APPROVED and INTERNAL_ERROR.
          minLength: 1
        message:
          type: string
          description: Safe human-readable explanation. Must not contain secrets, SQL details or stack traces.
        requestId:
          type: string
          description: Server-assigned request correlation identifier.
          minLength: 1
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationDetail"
          description: Optional validation details. Omit when there are no field-level errors.
    LoginRequest:
      type: object
      description:
        Provisional credential shape. The final login identifier must be approved before
        authentication integration. No public registration, roles or permissions are provided.
      additionalProperties: false
      required:
        - login
        - password
      properties:
        login:
          type: string
          description:
            Dispatcher login identifier. The unique identifier and its normalization require
            approval. fullName is not assumed to be unique.
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: Dispatcher password. Never return, log or include it in examples.
    AccessTokenResponse:
      type: object
      description:
        Confirmed access-token response only. Refresh-token delivery and storage are
        intentionally unspecified until its transport is approved. Token lifetimes also require
        approval.
      additionalProperties: false
      required:
        - accessToken
        - tokenType
      properties:
        accessToken:
          type: string
          minLength: 1
          readOnly: true
          description: JWT access token. No token literal is included in examples.
        tokenType:
          type: string
          enum:
            - Bearer
          readOnly: true
    CurrentDispatcherResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - fullName
      properties:
        id:
          type: string
          description: Opaque technical identifier. Never use a business number as a resource ID.
          minLength: 1
          readOnly: true
          example: dispatcher-example-1
        fullName:
          type: string
          description: Current dispatcher display name. A dispatcher is not a Driver record.
  responses:
    BadRequest:
      description:
        Invalid input, unknown properties or invalid referenced IDs. Validation details
        identify affected fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                code: VALIDATION_ERROR
                message: The request contains invalid fields.
                requestId: request-example-1
                details:
                  - field: routeIds
                    code: DUPLICATE_VALUE
                    message: Route IDs must be unique.
    Unauthorized:
      description: Missing, invalid or expired credentials. Do not disclose whether a login identifier exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                code: UNAUTHENTICATED
                message: Authentication is required or credentials are invalid.
                requestId: request-example-5
    NotFound:
      description: The addressed resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                code: RESOURCE_NOT_FOUND
                message: The requested resource was not found.
                requestId: request-example-6
    Conflict:
      description:
        Business conflict, conflicting concurrent operation or unapproved business rule. No
        partial changes are committed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                code: ROUTE_ALREADY_ASSIGNED
                message: A selected Route is already assigned to another Trip.
                requestId: request-example-2
            ruleNotApproved:
              value:
                code: BUSINESS_RULE_NOT_APPROVED
                message: This operation requires an approved business rule.
                requestId: request-example-3
            resourceInUse:
              value:
                code: RESOURCE_IN_USE
                message: The record is referenced by an existing Route or Trip.
                requestId: request-example-4
    InternalServerError:
      description: Unexpected server error. No internal implementation details are exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            default:
              value:
                code: INTERNAL_ERROR
                message: An unexpected error occurred.
                requestId: request-example-7
